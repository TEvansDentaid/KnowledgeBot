<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign in</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div class="page">
    <div class="card">
      <h1>Sign in</h1>
      <input id="email" type="email" placeholder="name@company.com">
      <input id="password" type="password" placeholder="Password">
      <button id="signInBtn">Sign in</button>
      <p class="muted" id="signInError"></p>
    </div>

    <div class="card">
      <h2>New business? Sign up here</h2>
      <input id="suEmail" type="email" placeholder="name@company.com">
      <input id="suPassword" type="password" placeholder="Choose a password">
      <input id="suBusinessName" type="text" placeholder="Business name">
      <button id="signUpBtn">Create business account</button>
      <p class="muted" id="signUpError"></p>
    </div>
  </div>

  <script src="/js/supabaseClient.js"></script>
  <script>
    document.getElementById('signInBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) { document.getElementById('signInError').textContent = error.message; return; }
      window.location.href = '/dashboard.html';
    });

    document.getElementById('signUpBtn').addEventListener('click', async () => {
      const email = document.getElementById('suEmail').value;
      const password = document.getElementById('suPassword').value;
      const businessName = document.getElementById('suBusinessName').value;
      const errEl = document.getElementById('signUpError');
      if (!businessName.trim()) { errEl.textContent = 'Business name is required'; return; }

      const { data: signUpData, error: signUpError } = await supabase.auth.signUp({ email, password });
      if (signUpError) { errEl.textContent = signUpError.message; return; }

      // Create the business record and link this user as its owner.
      const { data: business, error: bizError } = await supabase
        .from('businesses')
        .insert({ name: businessName })
        .select()
        .single();
      if (bizError) { errEl.textContent = bizError.message; return; }

      await supabase.from('business_users').insert({
        business_id: business.id,
        user_id: signUpData.user.id,
        role: 'owner',
      });

      window.location.href = '/wizard.html';
    });
  </script>
</body>
</html>
