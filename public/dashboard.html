<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div class="page">
    <div class="card">
      <h1><span data-business-name></span> dashboard</h1>
      <p class="muted">Assistant name: <span data-assistant-name></span></p>
      <p id="usageText" class="muted"></p>
      <a href="/interview.html"><button class="secondary">Continue the interview</button></a>
      <a href="/chat.html"><button class="secondary">Open chat</button></a>
    </div>

    <div class="card">
      <h2>Add knowledge from files</h2>
      <p class="muted">Works best with .txt or .md files for now.</p>
      <input id="fileInput" type="file" accept=".txt,.md">
      <button id="uploadBtn">Upload</button>
      <p class="muted" id="uploadMsg"></p>
    </div>

    <div class="card">
      <h2>Knowledge gaps</h2>
      <button id="runCheckBtn" class="secondary">Run coverage check</button>
      <div id="gapsList" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <h2>Invite a teammate</h2>
      <input id="inviteEmail" type="email" placeholder="name@company.com">
      <select id="inviteRole">
        <option value="user">User</option>
        <option value="developer">Developer</option>
      </select>
      <button id="inviteBtn" class="secondary">Send invite</button>
      <p class="muted" id="inviteMsg"></p>
    </div>
  </div>

  <script src="/js/supabaseClient.js"></script>
  <script>
    let currentBusiness = null;
    let currentRole = null;

    (async () => {
      await requireAuth();
      const membership = await getMyBusiness();
      if (!membership) { window.location.href = '/index.html'; return; }
      currentBusiness = membership.business;
      currentRole = membership.role;
      applyBranding(currentBusiness);
      document.getElementById('usageText').textContent =
        `${currentBusiness.messages_used} of ${currentBusiness.message_limit} messages used this period`;
      loadGaps();
    })();

    async function loadGaps() {
      const { data: gaps } = await supabase
        .from('knowledge_gaps')
        .select('*')
        .eq('business_id', currentBusiness.id)
        .eq('status', 'open')
        .order('occurrence_count', { ascending: false });

      const listEl = document.getElementById('gapsList');
      listEl.innerHTML = '';
      (gaps || []).forEach((gap) => {
        const row = document.createElement('div');
        row.className = 'gap-row';
        row.innerHTML = `<span>${gap.topic}${gap.occurrence_count > 1 ? ' (asked ' + gap.occurrence_count + ' times)' : ''}</span>`;
        const resolveBtn = document.createElement('button');
        resolveBtn.className = 'secondary';
        resolveBtn.textContent = 'Mark resolved';
        resolveBtn.addEventListener('click', async () => {
          await supabase.from('knowledge_gaps').update({ status: 'resolved' }).eq('id', gap.id);
          loadGaps();
        });
        row.appendChild(resolveBtn);
        listEl.appendChild(row);
      });
      if (!gaps || !gaps.length) listEl.innerHTML = '<p class="muted">No open gaps right now.</p>';
    }

    document.getElementById('runCheckBtn').addEventListener('click', async () => {
      await callFunction('coverage-check', {});
      loadGaps();
    });

    document.getElementById('uploadBtn').addEventListener('click', async () => {
      const file = document.getElementById('fileInput').files[0];
      const msgEl = document.getElementById('uploadMsg');
      if (!file) { msgEl.textContent = 'Choose a file first'; return; }
      const text = await file.text();
      const result = await callFunction('process-file', { filename: file.name, text });
      msgEl.textContent = result.error ? result.error : `Added ${result.chunksAdded} chunks from ${file.name}`;
    });

    document.getElementById('inviteBtn').addEventListener('click', async () => {
      const email = document.getElementById('inviteEmail').value;
      const role = document.getElementById('inviteRole').value;
      const result = await callFunction('invite-user', { email, role });
      document.getElementById('inviteMsg').textContent = result.error ? result.error : `Invited ${email}`;
    });
  </script>
</body>
</html>
